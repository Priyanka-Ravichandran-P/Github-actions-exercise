name: Execution Flow Test
on: push
jobs:
    lint:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout Repository
              uses: actions/checkout@v3
            - name: Install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install Dependencies
              run: npm ci
            - name: Run Linters
              run: npm run lint
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: Install Dependencies
          run: npm ci
        - name: Test
          run: npm test
        - name: Output Files
          uses: actions/upload-artifact@v4
          with:
            name: test result
            path: test-output
    build:
      needs: [lint, test]
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: Install Dependencies
          run: npm ci
        - name: Build
          run: npm run build
    deploy:
        needs: [build]
        runs-on: ubuntu-latest
        steps:
          - name: Output Info
            run: echo "Deplying...."

            