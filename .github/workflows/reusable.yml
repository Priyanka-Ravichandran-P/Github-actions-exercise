name: re-use workflow
on: 
  workflow_call:
    inputs:
      artifact-name:
        description: The name of the deployable artifact files
        required: false
        default: dist
        type: string
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Download Artifactory Files
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifact-name }}
            - name: Deploy
              run: echo "Deploying...."